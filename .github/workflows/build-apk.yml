name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          rm -rf buildsrc
          unzip -q SaiminNusrat_AndroidBuildKit.zip -d buildsrc
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x buildsrc/gradlew || true
          cd buildsrc
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaiminNusrat-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
